<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Расписание занятий — Казанский педагогический колледж</title>
    <meta
      name="description"
      content="Актуальное расписание занятий Казанского педагогического колледжа по группам и преподавателям, с подсветкой текущей пары и таймером перемены."
    />
    <meta name="theme-color" content="#f4f5fa" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/inter-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/theme-init.js"></script>
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="3" />
        <path d="M8 3v4M16 3v4M3 10h18" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6" />
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.2-3.2" />
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path
          d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"
        />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8Z" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M20 10c0 5.4-8 12-8 12s-8-6.6-8-12a8 8 0 1 1 16 0Z" />
        <circle cx="12" cy="10" r="2.6" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-2.6-6.4" />
        <path d="M21 4v5h-5" />
      </symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9" />
        <path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
      </symbol>
      <symbol id="i-graduation" viewBox="0 0 24 24">
        <path d="m2 9 10-5 10 5-10 5L2 9Z" />
        <path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5M22 9v5" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" />
        <path d="M4 19a2 2 0 0 1 2-2h14" />
      </symbol>
      <symbol id="i-award" viewBox="0 0 24 24">
        <circle cx="12" cy="9" r="5.5" />
        <path d="m8.5 13.5-2 7 5.5-3 5.5 3-2-7" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m4 12 5 5L20 6" />
      </symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24">
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="M12 3 2.5 20h19L12 3Z" />
        <path d="M12 9v5M12 17.2v.1" />
      </symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24">
        <path d="M3 13h5l1.5 3h5L16 13h5" />
        <path d="M5 5h14l2 8v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4l2-8Z" />
      </symbol>
      <symbol id="i-phone" viewBox="0 0 24 24">
        <path
          d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .6 3 .7a2 2 0 0 1 1.6 2Z"
        />
      </symbol>
    </svg>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/" id="brand-link" aria-label="Казанский педагогический колледж — на главную">
          <span class="brand__mark" aria-hidden="true">КПК</span>
          <span class="brand__text">
            <span class="brand__title">Казанский педагогический колледж</span>
            <span class="brand__sub">Расписание занятий</span>
          </span>
        </a>

        <nav class="nav" aria-label="Основные разделы">
          <a class="nav__link" href="#/schedule" data-nav="schedule">
            <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
            <span>Расписание</span>
          </a>
          <a class="nav__link" href="#/teachers" data-nav="teachers">
            <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
            <span>Преподаватели</span>
          </a>
        </nav>

        <div class="topbar__actions">
          <button class="group-pill" id="group-pill" type="button" hidden>
            <span class="group-pill__dot" aria-hidden="true"></span>
            <span class="group-pill__label" id="group-pill-label">Группа</span>
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
          </button>
          <button
            class="icon-btn"
            id="theme-toggle"
            type="button"
            aria-label="Переключить тему"
            title="Светлая / тёмная тема"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
