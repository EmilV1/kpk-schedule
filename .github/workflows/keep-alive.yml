name: Keep Render awake

on:
  schedule:
    # Каждые 5 минут с 07:00 до 22:59 по Москве (04:00–19:59 UTC).
    # Ночью сервис спит, чтобы не расходовать лимит 750 часов в месяц.
    - cron: '*/5 4-19 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging https://kpk-schedule.onrender.com/api/health"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            https://kpk-schedule.onrender.com/api/health
          echo
          echo "OK"
